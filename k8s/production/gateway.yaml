# This app's own HTTPS listeners on the shared Gateway's IP. While the old Gateway listener
# for a host still exists, this one shows Conflicted and the old one keeps serving.
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: davinci-sign
  namespace: davinci-sign-production
spec:
  parentRef:
    name: public
    namespace: envoy-gateway-system
  listeners:
    - name: https-sign-davincisolutions-ai
      protocol: HTTPS
      port: 443
      hostname: sign.davincisolutions.ai
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: davinci-sign-production-tls
      allowedRoutes:
        namespaces:
          from: Same
    - name: https-inbucket-davincisolutions-ai
      protocol: HTTPS
      port: 443
      hostname: inbucket.davincisolutions.ai
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: inbucket-tls
      allowedRoutes:
        namespaces:
          from: Same
---
# Same name and Secret as the Certificate the Ingress created, so nothing is reissued.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: davinci-sign-production-tls
  namespace: davinci-sign-production
spec:
  secretName: davinci-sign-production-tls
  dnsNames:
    - sign.davincisolutions.ai
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-prod
  usages:
    - digital signature
    - key encipherment
---
# Same name and Secret as the Certificate the Ingress created, so nothing is reissued.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: inbucket-tls
  namespace: davinci-sign-production
spec:
  secretName: inbucket-tls
  dnsNames:
    - inbucket.davincisolutions.ai
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-prod
  usages:
    - digital signature
    - key encipherment
---
# Lets the old Gateway listeners read the TLS Secrets during the handover. A cleanup PR removes it.
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: allow-gateway-tls
  namespace: davinci-sign-production
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: envoy-gateway-system
  to:
    - group: ""
      kind: Secret
      name: davinci-sign-production-tls
    - group: ""
      kind: Secret
      name: inbucket-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: davinci-sign
  namespace: davinci-sign-production
  labels:
    app: davinci-sign
    environment: production
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: davinci-sign
      sectionName: https-sign-davincisolutions-ai
    # Old Gateway listener, kept for the handover. A cleanup PR removes it and the ReferenceGrant.
    - name: public
      namespace: envoy-gateway-system
      sectionName: https-sign-davincisolutions-ai
  hostnames:
    - sign.davincisolutions.ai
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: davinci-sign
          port: 3000
      timeouts:
        request: 600s
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: davinci-sign
  namespace: davinci-sign-production
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: davinci-sign
  timeout:
    http:
      streamIdleTimeout: 300s
---
# Mirrors the inbucket Ingress: / Prefix -> inbucket:9000, no auth or allowlist annotations (none on the Ingress).
# nginx defaults reproduced: 60s read timeout -> 60s stream idle. Request timeout 0s so the UI's
# websocket monitor is not cut by a total-duration cap (nginx has none either).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: inbucket
  namespace: davinci-sign-production
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: davinci-sign
      sectionName: https-inbucket-davincisolutions-ai
    # Old Gateway listener, kept for the handover. A cleanup PR removes it and the ReferenceGrant.
    - name: public
      namespace: envoy-gateway-system
      sectionName: https-inbucket-davincisolutions-ai
  hostnames:
    - inbucket.davincisolutions.ai
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: inbucket
          port: 9000
      timeouts:
        request: 0s
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: inbucket
  namespace: davinci-sign-production
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: inbucket
  timeout:
    http:
      streamIdleTimeout: 60s
