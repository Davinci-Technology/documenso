apiVersion: apps/v1
kind: Deployment
metadata:
  name: davinci-sign
  namespace: davinci-sign-staging
  labels:
    app: davinci-sign
    environment: staging
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: davinci-sign
  template:
    metadata:
      labels:
        app: davinci-sign
        environment: staging
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '3000'
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
      - name: create-bucket
        image: davinciai.azurecr.io/minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
        command:
        - sh
        - -c
        - "echo \"Waiting for MinIO to be ready...\"\nfor i in $(seq 1 60); do\n \
          \ echo \"Attempt $i: Connecting to http://minio:9000...\"\n  if mc alias\
          \ set myminio http://minio:9000 davinci-sign \"$MINIO_ROOT_PASSWORD\"; then\n\
          \    echo \"MinIO ready! Creating bucket...\"\n    mc mb myminio/davinci-sign\
          \ --ignore-existing\n    echo \"Bucket ready!\"\n    exit 0\n  fi\n  echo\
          \ \"MinIO not ready, retrying in 5s...\"\n  sleep 5\ndone\necho \"Failed\
          \ to connect to MinIO after 60 attempts\"\nexit 1\n"
        env:
        - name: MC_CONFIG_DIR
          value: /tmp/.mc
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: davinci-sign-secrets
              key: MINIO_ROOT_PASSWORD
      - name: migrate
        image: RELEASE_IMAGE
        command:
        - npx
        - prisma
        - migrate
        - deploy
        - --schema
        - /app/packages/prisma/schema.prisma
        envFrom:
        - configMapRef:
            name: davinci-sign-config
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: davinci-sign-secrets
              key: POSTGRES_PASSWORD
        - name: NEXT_PRIVATE_DATABASE_URL
          value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(POSTGRES_DB)?sslmode=$(DB_SSLMODE)
        - name: NEXT_PRIVATE_DIRECT_DATABASE_URL
          value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(POSTGRES_DB)?sslmode=$(DB_SSLMODE)
      containers:
      - name: app
        image: RELEASE_IMAGE
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        envFrom:
        - configMapRef:
            name: davinci-sign-config
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: davinci-sign-secrets
              key: POSTGRES_PASSWORD
        - name: NEXT_PRIVATE_DATABASE_URL
          value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(POSTGRES_DB)?sslmode=$(DB_SSLMODE)
        - name: NEXT_PRIVATE_DIRECT_DATABASE_URL
          value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(POSTGRES_DB)?sslmode=$(DB_SSLMODE)
        - name: NEXTAUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: davinci-sign-secrets
              key: NEXTAUTH_SECRET
        - name: NEXT_PRIVATE_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: davinci-sign-secrets
              key: NEXT_PRIVATE_ENCRYPTION_KEY
        - name: NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY
          valueFrom:
            secretKeyRef:
              name: davinci-sign-secrets
              key: NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY
        - name: NEXT_PRIVATE_UPLOAD_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: davinci-sign-secrets
              key: NEXT_PRIVATE_UPLOAD_SECRET_ACCESS_KEY
        - name: NEXT_PRIVATE_SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: davinci-sign-secrets
              key: NEXT_PRIVATE_SMTP_PASSWORD
        - name: NEXT_PRIVATE_SIGNING_PASSPHRASE
          valueFrom:
            secretKeyRef:
              name: davinci-sign-secrets
              key: NEXT_PRIVATE_SIGNING_PASSPHRASE
        volumeMounts:
        - name: certificate
          mountPath: /opt/davinci-sign
          readOnly: true
        resources:
          requests:
            memory: 128Mi
            cpu: 50m
          limits:
            memory: 2Gi
            cpu: 1500m
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
            httpHeaders:
            - name: Host
              value: localhost
          initialDelaySeconds: 90
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
            httpHeaders:
            - name: Host
              value: localhost
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
      volumes:
      - name: certificate
        secret:
          secretName: davinci-sign-certificate
          items:
          - key: cert.p12
            path: cert.p12
          defaultMode: 256
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        runAsUser: 1001
      imagePullSecrets:
      - name: acr-pull-secret
---
apiVersion: v1
kind: Service
metadata:
  name: davinci-sign
  namespace: davinci-sign-staging
  labels:
    app: davinci-sign
    environment: staging
spec:
  selector:
    app: davinci-sign
  ports:
  - port: 3000
    targetPort: 3000
    name: http
  type: ClusterIP
