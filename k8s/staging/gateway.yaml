# This app's own HTTPS listener on the shared Gateway's IP.
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: davinci-sign
  namespace: davinci-sign-staging
spec:
  parentRef:
    name: public
    namespace: envoy-gateway-system
  listeners:
    - name: https-staging-sign-davincisolutions-ai
      protocol: HTTPS
      port: 443
      hostname: staging-sign.davincisolutions.ai
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: davinci-sign-staging-tls
      allowedRoutes:
        namespaces:
          from: Same
---
# Same name and Secret as the Certificate the Ingress created, so nothing is reissued.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: davinci-sign-staging-tls
  namespace: davinci-sign-staging
spec:
  secretName: davinci-sign-staging-tls
  dnsNames:
    - staging-sign.davincisolutions.ai
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-prod
  usages:
    - digital signature
    - key encipherment
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: davinci-sign
  namespace: davinci-sign-staging
  labels:
    app: davinci-sign
    environment: staging
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: davinci-sign
      sectionName: https-staging-sign-davincisolutions-ai
  hostnames:
    - staging-sign.davincisolutions.ai
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: davinci-sign
          port: 3000
      timeouts:
        request: 600s
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: davinci-sign
  namespace: davinci-sign-staging
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: davinci-sign
  timeout:
    http:
      streamIdleTimeout: 300s
